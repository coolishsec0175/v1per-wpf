name: Build MTK Backend

on:
  push:
    paths:
      - 'mtk-backend/**'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Clean and Build
        run: |
          cd mtk-backend
          cargo clean
          cargo build --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mtk-backend-windows
          path: mtk-backend/target/release/mtk-backend.exe
